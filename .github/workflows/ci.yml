name: CI

# PR 과 main push 마다 프론트 문법검사 + pytest 를 돌린다(로컬 테스트와 별개로 깃허브가 한 번 더 확인).
# - 프론트 테스트 상당수는 node 가 있어야 돈다(없으면 조용히 건너뛴다): node 를 설치하고, 건너뛴 테스트가 하나라도 있으면 실패로 본다
# - 테스트는 외부 네트워크를 쓰지 않는다(로컬에서 프록시를 막고 945개 통과 확인): 실수로 외부 호출이 들어오면 여기서 드러나게 프록시를 막는다
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Frontend syntax check
        run: |
          python - <<'EOF'
          import os, re
          s = open('frontend/index.html', encoding='utf-8').read()
          m = re.search(r'<script>\r?\n(.*)</script>\r?\n</body>', s, re.S)
          assert m, 'index.html 안의 인라인 스크립트를 찾지 못했습니다'
          open(os.path.join(os.environ['RUNNER_TEMP'], 'x.js'), 'w', encoding='utf-8').write(m.group(1))
          EOF
          node --check "$RUNNER_TEMP/x.js"

      - name: Tests (offline, no skips allowed)
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1
        run: |
          python -m pytest -q -rs -p no:cacheprovider | tee pytest.log
          if grep -Eq '[0-9]+ skipped|^SKIPPED' pytest.log; then
            echo "::error::건너뛴 테스트가 있습니다(node 설치나 환경을 확인하세요)"
            exit 1
          fi
